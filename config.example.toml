# nostr-notify configuration
#
# Location:
#   ~/.config/nostr-notify/config.toml   (user, takes precedence)
#   /etc/nostr-notify/config.toml        (system-wide)
#
# All fields are optional — the tool falls back to CLI flags and built-in
# defaults when a field is absent.  A malformed file is a hard error.

[identity]
# Path to the service keypair file generated by `nostr-notify keygen`.
# The file must contain a single nsec1... line (comments starting with # are
# ignored).  Mode 0600, owned by the user that runs the cron jobs.
key_file = "/etc/nostr-notify/service.nsec"

[recipient]
# Your Nostr public key (npub).  All notifications are sent as encrypted
# NIP-17 direct messages to this address.  Hex format is also accepted.
pubkey = "npub1..."

[relays]
# Relay URLs to publish gift-wrap events to.  All relays are tried in
# parallel; delivery succeeds if any one returns OK.  Because messages are
# NIP-59 gift-wrapped (end-to-end encrypted), it is safe to include public
# relays — they see only an encrypted blob addressed to your npub.
urls = [
  "wss://relay1.example.com",
  "wss://relay2.example.com",
]

[message]
# Content format for the message body.
# "plain" sends content as-is (default).
# "code"  wraps the body in a fenced Markdown code block — preserves column
#         alignment for tabular output (df, ps, log tails) in Nostr clients
#         that render Markdown in DMs.
# format = "code"

# ── Coming in a future release ─────────────────────────────────────────────

